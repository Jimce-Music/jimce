name: jimce_api_flutter
description: "Generated Flutter API client for the Jimce Music server."
version: 0.0.1
homepage: https://github.com/Jimce-Music/jimce
repository: https://github.com/Jimce-Music/jimce
issue_tracker: https://github.com/Jimce-Music/jimce/issues

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  copy_with_extension: ^14.0.0
  dio: ^5.9.0
  json_annotation: ^4.11.0

dev_dependencies:
  build_runner: ^2.7.0
  copy_with_extension_gen: ^14.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

